name: SAMARTH daily data refresh

# Runs the live Supabase-backed aggregation pipeline (pipeline/aggregate.py)
# and pushes its output to the `dashboard_payload` table the SAMARTH
# website (index.html) reads from. This is the automated replacement for
# the one-off manual `curl` pushes documented in this project's history --
# see claude/supabase-live-deployment-notes.md's "Daily automation"
# section for why this had to move here: Claude's own safety system
# blocks storing a service_role key anywhere for later unattended re-use,
# so the key lives only in this repo's own GitHub Actions Secrets, never
# inside a Claude session or chat.
#
# ---------------------------------------------------------------------
# ONE-TIME SETUP (done once, by a human, in this repo's own settings --
# Claude cannot do any of this: it has no GitHub write access):
#
# 1. Add this pipeline's code to the repo under pipeline/ (see
#    pipeline/README.md for the exact file list and layout).
# 2. Settings -> Secrets and variables -> Actions -> New repository secret,
#    three times:
#      SUPABASE_URL                e.g. https://xxxxx.supabase.co
#      SUPABASE_ANON_KEY           the anon/public key (read-only; every
#                                   sync table grants it SELECT)
#      SUPABASE_SERVICE_ROLE_KEY   the service_role key (write access to
#                                   dashboard_payload only -- this is the
#                                   one that was already created for the
#                                   earlier manual-push era; reuse it)
# 3. That's it -- no further manual steps. This workflow runs itself daily
#    from here on, and "Run workflow" below also lets a human trigger an
#    out-of-schedule refresh at any time.
# ---------------------------------------------------------------------
on:
  schedule:
    # Two runs a day from 25-Nov-2026, per Shruti ("set github with a
    # margin so it doesn't miss... set a refresh twice a day"), after we
    # saw a scheduled run on GitHub actually fire ~10-11 hours late (it
    # showed "15h ago" at 11:48 AM, meaning it really ran the previous
    # evening, not at its 10:00 AM slot). Two changes, for two different
    # problems:
    #
    # 1. Wider margin on the morning run: 05:15 UTC = ~10:45 AM IST,
    #    widened from the previous 10:00 AM (only a ~30-minute gap after
    #    the ~9:30 AM Apps Script sync). This guards against the Apps
    #    Script trigger itself landing a few minutes later than its
    #    ~9:30 AM target on a given day -- Apps Script time triggers are
    #    not minute-exact either.
    # 2. A second, backup run in the evening: 13:00 UTC = ~6:30 PM IST.
    #    This is the real fix for the bigger problem above -- GitHub
    #    itself can delay or, rarely, drop a scheduled ("cron") run during
    #    busy periods on its own infrastructure, by hours, unpredictably.
    #    No amount of margin on the morning time fixes that; it can only
    #    be caught by a second attempt later the same day, so a missed/
    #    very-late morning run still gets the dashboard refreshed before
    #    the day is over. The evening run simply re-reads whatever the
    #    Google Sheets already have (they only change once a day, via the
    #    ~9:30 AM Apps Script sync) and re-pushes to Supabase -- harmless
    #    to run twice on a day when the morning run worked fine.
    - cron: '15 5 * * *'
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      as_of:
        description: 'Override the as-of date (YYYY-MM-DD). Leave blank to use today.'
        required: false
        default: ''

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Fixed 14-Nov-2026: raised from 10 - the rdps_points pagination fix
    # (supabase_client.fetch_rows() now pages through Supabase's 1000-row-
    # per-request cap instead of silently truncating) adds a real ~2
    # minutes to every run for that one table's ~430,000 rows alone, so
    # the old 10-minute ceiling left very little margin.
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # No requirements.txt / pip install step on purpose: every file
          # under pipeline/ uses only the Python standard library
          # (urllib for the Supabase REST calls, no openpyxl/python-docx
          # -- those were only ever needed by the OLD local-file pipeline,
          # run_pipeline.py, not by this live-Supabase one).

      - name: Run unit tests (CI smoke check)
        working-directory: pipeline
        run: |
          # The adapter-fixture and end-to-end classes in test_integrity.py
          # skip themselves automatically here (no cached /tmp/*_latest.json
          # fixtures exist on a CI runner, and this step has no Supabase
          # credentials either) -- only the pure, network-free tests
          # actually run, as a fast sanity check that nothing in
          # pipeline_helpers.py/network_map.py/daily_progress_srden.py/
          # daily_positions.py is broken before spending a live Supabase
          # round-trip on a run that would just fail anyway. Fixed
          # 14-Nov-2026 (second round): added test_daily_positions,
          # covering the same day's fix to extract_positions()'s own
          # dict key (it used to collapse two distinct real machines,
          # e.g. the two separate T-28 units, onto the same key -- see
          # that module's docstring).
          python3 -m unittest tests.test_integrity tests.test_network_map tests.test_daily_progress_srden tests.test_daily_positions -v

      - name: Build dashboard_payload.json from live Supabase sources
        working-directory: pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          AS_OF_ARGS=""
          if [ -n "${{ github.event.inputs.as_of }}" ]; then
            AS_OF_ARGS="--as-of ${{ github.event.inputs.as_of }}"
          fi
          python3 aggregate.py /tmp/samarth_out $AS_OF_ARGS

      - name: Push to Supabase (dashboard_payload table)
        working-directory: pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 push_to_supabase.py /tmp/samarth_out/dashboard_payload.json

      - name: Upload payload as a build artifact (for inspection / debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard_payload-${{ github.run_id }}
          path: /tmp/samarth_out/dashboard_payload.json
          retention-days: 14
